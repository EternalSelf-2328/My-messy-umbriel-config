# ───────────────────────────── Window Rules ─────────────────────────────────
# Match windows by application ID, title, XDG tag, content type, or focus state.
# Opening settings apply once; effects and output policies update while mapped.
# Documentation: https://docs.noctalia.dev/umbriel/window-rules/
# ────────────────────────────────────────────────────────────────────────────
#[appearance]
#corner_radius = 10

# Blur every window. Keep this selectorless rule first so later matching rules
# can override individual blur settings.
# blur_optimized left at the global default (shared cached blur per output) -
# forcing it false here made every window recompute its own blur pass instead
# of reusing one, which is expensive on integrated/low-power GPUs.
[[window_rule]]
blur = true
# blur_optimized = false

# Noctalia settings
[[window_rule]]
match.app_id = "^dev.noctalia.Noctalia$"
default_floating = true
default_floating_size_px = {width = 1020, height = 900}

# Noctalia share picker
[[window_rule]]
match.app_id = "^dev.noctalia.UmbrielSharePicker$"
default_floating = true
default_floating_size_px = { width = 800, height = 600 }


# Browsers expose no semantic PiP role or global position control.
[[window_rule]]
match.title = "^(Picture-in-Picture|Picture in picture)$"
default_floating = true
default_maximize = false
default_floating_size_px = { width = 406, height = 224 }
#default_position = { x = 200, y = 200, anchor = "bottom_right" }

# Keep Steam notification toasts in the bottom-right corner without stealing
# focus, and pin them so workspace switches do not hide them.
# Superseded by the properly anchored "Steam Notifications" rule further down
# (matches app_id + a fully anchored title, and always wins since it's later),
# so this one was dead weight - kept here commented for reference.
# [[window_rule]]
# match.title = "^notificationtoasts_.+_desktop"
# default_position = { x = 0, y = 0, anchor = "bottom_right" }
# default_focused = false
# default_pinned = true

# El radio de las esquinas se define globalmente, no por ventana

# Noctalia Settings
[[window_rule]]
match.app_id = "^dev\\.noctalia\\.Noctalia\\.Settings$"
default_floating = true
default_floating_size_px = { width = 1041, height = 920 }

# Editores y utilidades
[[window_rule]]
match.app_id = "^(code|antigravity|md\\.obsidian\\.Obsidian|kate|gns3|libreoffice-writer|libreoffice-calc|Bricscad|dev\\.zed\\.Zed)$"
default_maximize = true
opacity = 0.95

# Vesktop
[[window_rule]]
match.app_id = "^vesktop$"
default_maximize = true
# opacity overridden to 0.95 by the group rule below; left unset here to avoid confusion
blur = true

# Grupo de opacidad 0.95 (Sobreescribirá la opacidad de vesktop a 0.95)
# app_id must match `umbriel windows` exactly (case-sensitive, distinct string):
# fixed "tauon" -> "tauonmb" and "spotify" -> "Spotify" to match the dedicated
# floating rules for those apps further down, which use the real app_id.
[[window_rule]]
match.app_id = "^(com\\.github\\.neithern\\.g4music|vesktop|nemo|wireshark|tauonmb|easyeffects|heroic|fdm|Spotify|org\\.keepassxc\\.KeePassXC)$"
opacity = 0.95

# Navegadores
[[window_rule]]
match.app_id = "^(brave|zen)$"
opacity = 0.98
default_maximize = true
blur = true

# Terminales
[[window_rule]]
match.app_id = "^kitty$"
opacity = 0.85

# Picture in Picture (Brave y Zen)
# This rule is placed after "Navegadores" (which maximizes all brave/zen
# windows) and after "Blur every window", so its own values win for size,
# position, and maximize. Previously it only set default_floating, so the
# maximize=true from "Navegadores" always won, and with no floating size or
# position set, the compositor fell back to its default corner placement -
# which is why the PiP window always ended up maximized/top-left instead of a
# small floating box in the corner.
[[window_rule]]
match.app_id = "^(brave|zen)$"
match.title = "^(Pantalla en pantalla|Picture-in-Picture)$"
default_floating = true
default_maximize = false
default_floating_size_px = { width = 406, height = 224 }
default_position = { x = 24, y = 24, anchor = "bottom_right" }

# Zenity
[[window_rule]]
match.app_id = "^zenity$"
default_floating = true

# Kitty fl_term
[[window_rule]]
match.app_id = "^kitty$"
match.title = "^fl_term$"
default_floating = true
opacity = 0.80
default_floating_size_px = {width = 1020, height = 900}

# Steam Notifications
[[window_rule]]
match.app_id = "^steam$"
match.title = "^notificationtoasts_\\d+_desktop$"
default_floating = true
default_position = { x = 10, y = 10, anchor = "bottom_right" }
default_focused = false
default_pinned = true

# Tauon Flotante
[[window_rule]]
match.app_id = "^tauonmb$"
default_floating = true
default_floating_size_px = { width = 853, height = 516 }
default_position = { x = 1034, y = 95, anchor = "top_right" }

# Spotify Flotante
[[window_rule]]
match.app_id = "^Spotify$"
default_floating = true
default_floating_size_px = { width = 1005, height = 657 }
#default_size = [1005, 657]
default_position = { x = 72, y = 76, anchor = "top_left" }
default_workspace = 1
