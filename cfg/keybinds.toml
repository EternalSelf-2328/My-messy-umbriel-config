# Quote an all-digit name to distinguish it from a position.
# "Mod+Ctrl+2" = 'workspace-switch:"2"/DP-2'

# Scratchpads
# These bare actions use the implicit `default` scratchpad because no named
# definitions are active above. A scratchpad is global: toggling it summons all
# its windows to the output under the pointer. Only outputs with a visible
# scratchpad receive its dim and blur backdrop.
# Resize, maximize, fullscreen, and close actions target a scratchpad that owns
# keyboard focus. Layout-relative window actions leave the workspace behind it
# unchanged.
# `window-focus:<window-id>` and `window-focus-warp:<window-id>` also summon a
# hidden scratchpad target to the output under the pointer. The `-warp` form
# then moves the cursor to that target.
# Documentation: https://docs.noctalia.dev/umbriel/scratchpads/
#"Mod+Shift+Space" = "window-move-to-scratchpad"
#"Mod+Ctrl+Space" = "window-restore-from-scratchpad"

